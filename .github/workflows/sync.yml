name: Сверка со списком закладок

# Список правят несколько раз в день, не чаще. Дважды в сутки хватает,
# а Яндекс от частых заходов с чужих адресов начинает показывать капчу.
on:
  schedule:
    - cron: '0 5,17 * * *'      # 08:00 и 20:00 по Москве
  workflow_dispatch:            # и вручную — кнопкой в Actions
    inputs:
      apply:
        description: 'Вписать новые точки в маршруты, а не только отчёт'
        type: boolean
        default: true

permissions:
  contents: write

concurrency:
  group: sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Сверить и вписать
        id: run
        run: |
          set -o pipefail
          FLAG=""
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ inputs.apply }}" = "true" ]; then
            FLAG="--apply"
          fi
          python3 tools/sync_points.py $FLAG 2>&1 | tee sync.log
          {
            echo '## Сверка со списком «Печати 2026»'
            echo '```'
            cat sync.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Проверить данные
        run: |
          python3 - <<'PY'
          import json, pathlib, sys
          d = json.loads(pathlib.Path('public/data/points.json').read_text(encoding='utf-8'))
          ids = [p['id'] for r in d['routes'] for p in r['points']]
          assert len(set(ids)) == len(ids), 'дублирующиеся id'
          for r in d['routes']:
              assert r['points'], f"пустой маршрут {r['id']}"
              for i, p in enumerate(r['points'], 1):
                  assert p['i'] == i and p['code'].endswith(f"{i:02d}"), f"сбита нумерация в {r['short']}"
                  assert 59.5 < p['lat'] < 60.5 and 29 < p['lon'] < 31, f"координаты вне города: {p['name']}"
          print(f"ок: {len(ids)} точек в {len(d['routes'])} маршрутах")
          PY

      - name: Закоммитить, если что-то поменялось
        run: |
          git config user.name  'pechati-bot'
          git config user.email 'actions@github.com'
          if git diff --quiet -- public tools; then
            echo 'изменений нет'
            exit 0
          fi
          COUNT=$(python3 -c "import json;d=json.load(open('public/data/points.json'));print(sum(len(r['points']) for r in d['routes']))")
          git add public tools
          git commit -m "Сверка со списком: $COUNT точек в маршрутах" \
                     -m "$(grep -E '^\s+\+' sync.log | head -20 || true)"
          git push

      - name: Обновить сайт
        run: |
          git fetch origin gh-pages --depth=1 || true
          git subtree push --prefix public origin gh-pages || {
            echo 'история разошлась, перезаписываем ветку сайта'
            git push origin "$(git subtree split --prefix public)":gh-pages --force
          }
