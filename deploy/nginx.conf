# Печати 2026. Замените ПЕЧАТИ.ВАШ-ДОМЕН на свой домен,
# затем: sudo certbot --nginx -d ПЕЧАТИ.ВАШ-ДОМЕН

server {
    listen 80;
    listen [::]:80;
    server_name ПЕЧАТИ.ВАШ-ДОМЕН;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name ПЕЧАТИ.ВАШ-ДОМЕН;

    # строки ssl_certificate допишет certbot
    root /srv/pechati/public;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 512;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # свой код и данные — только с перепроверкой, иначе после деплоя
    # у людей неделю живёт старый app.js
    location ~* \.(html|js|css|json|webmanifest)$ {
        add_header Cache-Control "no-cache" always;
    }

    # leaflet и иконки не меняются
    location ^~ /vendor/ {
        add_header Cache-Control "public, max-age=604800, immutable" always;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:8781;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        client_max_body_size 16k;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
